# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-swarm"
version = "0.1.1"
description = "Plug-and-play SDK for building immortal, self-healing multi-agent AI systems"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Nikhil Kumar", email = "nik0811@example.com"}
]
keywords = ["ai", "agents", "multi-agent", "llm", "rag", "swarm", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "tiktoken>=0.5",
]

[project.urls]
Homepage = "https://github.com/nik0811/agentic-swarm"
Documentation = "https://github.com/nik0811/agentic-swarm/tree/main/docs"
Repository = "https://github.com/nik0811/agentic-swarm"
Issues = "https://github.com/nik0811/agentic-swarm/issues"
Changelog = "https://github.com/nik0811/agentic-swarm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.18"]
bedrock = ["boto3>=1.34"]
gemini = ["google-genai>=1.0"]
groq = ["groq>=0.4"]
qdrant = ["qdrant-client>=1.7"]
redis = ["redis>=5.0"]
crypto = ["cryptography>=41.0"]
all = [
    "openai>=1.0",
    "anthropic>=0.18",
    "boto3>=1.34",
    "google-genai>=1.0",
    "groq>=0.4",
    "qdrant-client>=1.7",
    "redis>=5.0",
    "cryptography>=41.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "bandit[toml]>=1.7",
    "cryptography>=41.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict
    "SIM108", # use ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["agentic_swarm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101"]  # assert_used

[tool.coverage.run]
source = ["agentic_swarm"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["agentic_swarm"]
