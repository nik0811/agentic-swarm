# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-swarm"
version = "0.1.0"
description = "Plug-and-play SDK for multi-agent AI systems"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "tiktoken>=0.5",      # Token counting
    "qdrant-client>=1.7",  # Vector DB
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.18"]
all = ["openai>=1.0", "anthropic>=0.18"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]
